# PORT NUMBERS > 1000
# Linux and WSL don't allow apps run by non-root users to bind to port numbers below 1000.
# We *could* run as root and use lower port numbers, but it's easier and more practical to 
# just have Docker remap incoming requests to port numbers above 1000 and bind to those ports.
# You'll see this port remapping in the docker-compose.yml.

# Do not write malformed-request 400 responses to the access log.
map $status $write_access_log {
    default 1;
    400     0;
}

# LOCAL DEVELOPMENT
# Serve the TrackEats app directly when accessed via localhost or 127.0.0.1 (no SSL needed).
server {
    listen 8080 default_server;
    server_name localhost 127.0.0.1 _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# LAST CALL SOFTWARE HOME PAGE
# Redirect HTTP requests from "lastcallsoftware.com" and "www.lastcallsoftware.com" 
# to HTTPS "www.lastcallsoftware.com".
server {
    listen 80 default_server;
    listen 8080;

    server_name lastcallsoftware.com www.lastcallsoftware.com;

    access_log /var/log/nginx/access.log combined if=$write_access_log;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://www.lastcallsoftware.com$request_uri;
    }
}
# Listen for HTTPS requests to "lastcallsoftware.com" and "www.lastcallsoftware.com".
server {
    listen 443 ssl default_server;
    listen 8443 ssl default_server;

    server_name lastcallsoftware.com www.lastcallsoftware.com;

    ssl_certificate /etc/letsencrypt/live/lastcallsoftware.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lastcallsoftware.com/privkey.pem;

    root /usr/share/nginx/lastcallsoftware;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# TRACKEATS FRONT END
# Redirect HTTP requests from "trackeats.com", "www.trackeats.com" and "trackeats.lastcallsoftware.com"
# to HTTPS "trackeats.lastcallsoftware.com".
server {
    listen 80;
    listen 8080;

    server_name trackeats.com www.trackeats.com trackeats.lastcallsoftware.com;

    access_log /var/log/nginx/access.log combined if=$write_access_log;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://trackeats.lastcallsoftware.com$request_uri;
    }
}
# Listen for HTTPS rerquests to "trackeats.lastcallsoftware.com".
server {
    listen 443 ssl;
    listen 8443 ssl;

    server_name trackeats.lastcallsoftware.com;

    ssl_certificate /etc/letsencrypt/live/lastcallsoftware.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lastcallsoftware.com/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Tell the browser NOT to cache index.html
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
    }

    # Tell the browser to cache static assets
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }    
}

# PERSONAL HOME PAGE
# Redirect HTTP requests from "pwholmes.com", "www.pwholmes.com" and "pwholmes.lastcallsoftware.com"
# to HTTPS "pwholmes.lastcallsoftware.com".
server {
    listen 80;
    listen 8080;

    server_name pwholmes.com www.pwholmes.com pwholmes.lastcallsoftware.com;

    access_log /var/log/nginx/access.log combined if=$write_access_log;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    location / {
        return 301 https://pwholmes.lastcallsoftware.com$request_uri;
    }
}
# Listen for HTTPS requests to "pwholmes.lastcallsoftware.com".
 server {
    listen 443 ssl;
    listen 8443 ssl;

    server_name pwholmes.lastcallsoftware.com;

    ssl_certificate /etc/letsencrypt/live/lastcallsoftware.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lastcallsoftware.com/privkey.pem;

    #root /usr/share/nginx/html;
    root /usr/share/nginx/portfolio;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
 }

# TRACKEATS BACK END
# Redirect HTTPS requests from "trackeats.com" and "www.trackeats.com" to HTTPS "trackeats.lastcallsoftware.com"
# server {
#     listen 5443;

#     server_name trackeats.com www.trackeats.com;

#     return 301 https://trackeats.lastcallsoftware.com:5443;
# }
# Listen for HTTPS requests to "trackeats.lastcallsoftware.com" on port 5443.
# Redirect to the backend Docker container listening on port 5000 after doing the SSL thing.
# Port 5000 is blocked to external traffic by the AWS port policy, so SSL via
# this proxy server in the frontend is the only way to communicate with the backend.
server {
    listen 5443 ssl;

    server_name trackeats.lastcallsoftware.com;

    ssl_certificate /etc/letsencrypt/live/lastcallsoftware.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lastcallsoftware.com/privkey.pem;

    location / {
        # Use Docker's internal DNS resolver so nginx resolves "backend" at
        # request time rather than startup (prevents crash if backend is not
        # yet up when nginx starts).
        resolver 127.0.0.11 valid=10s;
        set $backend_upstream http://backend:5000;
        proxy_pass $backend_upstream;
    }
}
