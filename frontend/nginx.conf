# PORT NUMBERS > 1000
# Linux and WSL don't allow apps run by non-root users to bind to port numbers below 1000.
# We *could* run as root and use lower port numbers, but it's easier and more practical to 
# just have Docker remap incoming requests to port numbers above 1000 and bind to those ports.
# You'll see this port remapping in the docker-compose.yml.

# Do not write malformed-request 400 responses to the access log.
map $status $write_access_log {
    default 1;
    400     0;
}

# LOCAL DEVELOPMENT & INTERNAL ONLY
# Serve the TrackEats React app. This nginx instance runs inside docker and is reverse-proxied
# by the webspaces nginx (which handles TLS, routing, and static websites).
# Local dev can access via localhost:3000 (mapped to container port 8080).
server {
    listen 8080 default_server;
    server_name _;

    access_log /var/log/nginx/access.log combined if=$write_access_log;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Tell the browser NOT to cache index.html
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
    }

    # Tell the browser to cache static assets
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}

